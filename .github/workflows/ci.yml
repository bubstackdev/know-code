# The merge gates from docs/evaluation.md "Gates per change": tests (the invariant suite as a step of its own), clippy with no
# warnings, the eval harness's own tests, docs naming only files that exist, the dist binary against
# size-budget.txt (measured on aarch64-apple-darwin, so that job runs on macOS), the Linux binaries' glibc 2.28 floor,
# and the release replay gate's fast subset against the latest release.
# Actions are GitHub-owned and pinned to commit SHAs, as the repository's Actions policy requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only: no job here publishes. The release workflow grants write access only to the job creating a release.
# Checkouts don't keep the token in .git/config (persist-credentials: false): no job pushes or fetches after checkout,
# and the tests run the repository's own code.
permissions:
  contents: read

# A new push to a pull request or a branch cancels that ref's older run: the newest run tests everything before it,
# so a failure still shows, and merges in quick succession don't queue for runners. (A release tag runs no CI of its
# own: release-gate.yml requires a passing run of this workflow on the tagged commit.)
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  KNOWCODE_UPDATE_CHECK: "0"

jobs:
  release-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the pinned release generator
        run: bash scripts/install-dist.sh
      - name: Verify compiled source-path privacy
        run: python3 -B scripts/test_dist_build.py
      - name: Verify release workflow and publishing gate
        run: python3 scripts/generate-release.py --check
      - name: Plan all release targets without publishing
        run: dist plan --output-format=json --no-local-paths

  # Whether the change touches anything but prose: docs/, eval/ pages and top-level Markdown. A prose-only change is
  # still built and tested on Linux (check-docs.py and check-doc-paths.py read it), but skips the macOS test and size
  # jobs, which wait for scarce macOS runners and can't fail on prose. Anything else, or a base it can't diff
  # against, counts as code.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      test-os: ${{ steps.diff.outputs.code == 'true' && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$changed" ] && ! grep -qvE '^(docs/.*|eval/.*\.md|[^/]+\.md)$' <<<"$changed"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.changes.outputs.test-os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: test-${{ runner.os }}-
      # The Python checks below commit to throwaway repos with the runner's own HOME, so they need a global identity
      # (cargo's test binaries get the same one inside scripts/test-runner's sandbox). A global identity, not
      # GIT_AUTHOR_* variables, so a test's own `-c user.name=…` still wins (an author named like a bot is left out of
      # history answers).
      - run: git config --global user.name "Test Author" && git config --global user.email test@example.test
      # The invariant suite (every test named `invariant_…`, see docs/evaluation.md) first, so a broken invariant is
      # reported as one; the full run below includes them again.
      - name: invariants
        run: cargo test --workspace --locked -- invariant
      - run: cargo test --workspace --locked
      - name: docs match the binary's commands, flags, config keys and MCP tools
        run: python3 scripts/check-docs.py target/debug/knowcode
      - name: cold MCP first run and background indexing
        run: python3 scripts/check-first-run.py target/debug/knowcode
      - name: registered roots and lazy cross-repo first run
        run: python3 scripts/check-workspace-first-run.py target/debug/knowcode
      - name: isolated update checks and self-update rollback
        run: python3 scripts/check-updates.py target/debug/knowcode
      - name: native macOS evaluation isolation boundary
        if: runner.os == 'macOS'
        env:
          KNOWCODE_TEST_MACOS_SANDBOX: "1"
        run: python3 -B -m unittest discover -s scripts/eval -p 'test_public_sandbox.py'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.os == 'ubuntu-24.04'

  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/eval -p 'test_*.py'
      - run: python -m unittest discover -s scripts/eval/neutral -p 'test_*.py'
      - run: python -m unittest discover -s scripts/acceptance -p 'test_*.py'
      - run: bash -n scripts/acceptance/clean-machine.sh
      # The runner image ships shellcheck.
      - run: shellcheck scripts/acceptance/clean-machine.sh

  # deny.toml: RustSec advisories, banned crates (the no-HTTP privacy guard), licences and sources. The advisory
  # database is fetched fresh, so a newly published advisory for a locked crate fails every run until it's dealt with.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the pinned cargo-deny
        run: bash scripts/install-cargo-deny.sh
      - run: cargo deny --locked check advisories bans licenses sources

  # README.md and docs/ naming a crate or script file that no longer exists.
  doc-paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python scripts/check-doc-paths.py

  # One fat-LTO build: the packaged binary is the one measured, so it isn't built a second time for check-size.sh.
  size:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dist-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: dist-${{ runner.os }}-
      - name: Install the pinned release generator
        run: bash scripts/install-dist.sh
      - name: Package the native macOS binary and installer preview
        env:
          CARGO_BUILD_JOBS: "2"
        run: bash scripts/package-native.sh
      - name: The packaged binary against size-budget.txt
        run: scripts/check-size.sh --no-build target/aarch64-apple-darwin/dist/knowcode
      - name: Test the isolated shell installer and installed MCP binary
        run: python3 scripts/check-installer.py target/distrib

  # The Linux release binaries' portability, before a tag: a build in the manylinux_2_28 image dist-workspace.toml
  # pins for the release, checked for glibc symbols newer than 2.28 and run on the oldest supported distributions
  # (the release's own gate, linux-compat.yml, repeats both on the published archives). A debug build: which glibc
  # symbols get linked depends on the build image, not the profile. Skipped, like size, when only prose changed.
  linux-compat:
    name: linux-compat (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/compat
          key: compat-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'dist-workspace.toml') }}
          restore-keys: compat-${{ matrix.target }}-
      - name: build in the release's pinned manylinux_2_28 image
        run: |
          image=$(python3 -c 'import sys, tomllib; print(tomllib.load(open("dist-workspace.toml", "rb"))["dist"]["github-custom-runners"][sys.argv[1]]["container"]["image"])' "$TARGET")
          mkdir -p "$RUNNER_TEMP/compat"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/compat:/compat" -w /src \
            -e CARGO_HOME=/compat/cargo -e RUSTUP_HOME=/compat/rustup -e CARGO_TARGET_DIR=/compat/target "$image" \
            bash -c 'set -e; [ -x /compat/cargo/bin/rustup ] || curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path; PATH=/compat/cargo/bin:$PATH cargo build --locked -p knowcode'
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/compat"
      - name: no glibc symbol newer than 2.28
        run: python3 scripts/check-glibc.py --max 2.28 "$RUNNER_TEMP/compat/target/debug/knowcode"
      - name: start, index and answer on the oldest supported distributions
        run: bash scripts/check-linux-compat.sh "$RUNNER_TEMP/compat/target/debug/knowcode"

  # The release replay gate on its fast subset (eval/replay-gate/README.md): the recorded KnowCode calls on five small
  # public repositories, replayed against the latest release and against this change's build, with no model calls. It
  # fails on a regression beyond the gate's tolerances, and the comparison goes in the job summary. Linux only, so it
  # never waits for a macOS runner.
  replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      SUBSET: autofac,autofac-di,serilog,serilog-aspnetcore,serilog-extensions-hosting
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: replay-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: replay-${{ runner.os }}-
      - name: build this change
        run: cargo build --locked -p knowcode
      - name: the latest release, checked against its published checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'knowcode-x86_64-unknown-linux-gnu.tar.gz*'
          sha256sum -c knowcode-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar xzf knowcode-x86_64-unknown-linux-gnu.tar.gz
      # The pinned public source of the subset: a shallow fetch of each pinned commit, exported as for the published
      # studies. Cached by the manifest that pins them; the replay works on its own copies and never writes into it.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/replay-source
          # This workflow names the subset (a cache key can't hold its commas); the manifest pins it.
          key: replay-source-${{ hashFiles('eval/public-v2/manifest.json', 'scripts/prepare-public-eval.py', '.github/workflows/ci.yml') }}
      - name: fetch the pinned public source
        run: |
          if [ ! -f "$RUNNER_TEMP/replay-source/source-receipt.json" ]; then
            python scripts/eval/replay_gate.py fetch --repos "$SUBSET" --out "$RUNNER_TEMP/replay-source"
          fi
      - name: replay the release and this change, and compare
        run: |
          src="$RUNNER_TEMP/replay-source" work="$RUNNER_TEMP/replay-work"
          python scripts/eval/replay_gate.py run --knowcode "$RUNNER_TEMP/knowcode-x86_64-unknown-linux-gnu/knowcode" \
            --label release --source "$src" --work "$work" --repos "$SUBSET" --out "$RUNNER_TEMP/release.json"
          python scripts/eval/replay_gate.py run --knowcode target/debug/knowcode \
            --label change --source "$src" --work "$work" --repos "$SUBSET" --out "$RUNNER_TEMP/change.json"
          status=0
          python scripts/eval/replay_gate.py compare "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/change.json" \
            --out "$RUNNER_TEMP/replay.md" || status=$?
          { echo "## Release replay gate (fast subset)"; echo; cat "$RUNNER_TEMP/replay.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # The latest release and this change take turns on one cache: both answer every time, and neither changes the
      # other's data (docs/architecture.md, "Versions sharing a cache").
      - name: the latest release and this change share a cache
        run: python scripts/check-cache-compat.py "$RUNNER_TEMP/knowcode-x86_64-unknown-linux-gnu/knowcode" target/debug/knowcode

  # One check that always reports, for the main branch's ruleset to require: it fails if any job above failed or was
  # cancelled, and passes when the rest passed or were skipped (macOS and size on prose-only changes, replay on pushes).
  # Requiring the per-job names instead can't cover `test (macos-15)` or the linux-compat matrix, which a prose-only
  # change never creates. A new job joins `needs` here so the ruleset never has to change.
  ci-ok:
    if: always()
    needs: [release-plan, changes, test, harness, doc-paths, deny, size, linux-compat, replay]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if jq -e 'any(.[]; . != "success" and . != "skipped")' <<<"$RESULTS" >/dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
