[workspace]
members = ["crates/core", "crates/host", "bindings/ffi", "bindings/node/native"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
know-code-core = { path = "crates/core" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "=0.41.1", features = ["bundled", "fallible_uint", "blob", "hooks"] }
