# Search parity set (M5): every query runs through `knowcode search` and through `git grep` at pinned commits, over
# the same files, and the (repo, file, line) sets must match exactly. `scripts/search_eval.py` runs it.
#
# Fields: id, backs (the eval question in questions.toml it supports, if any), repos (`name` for a public corpus repo
# from corpus.toml, `repo@sha` for a workspace repo at a pin), pattern, regex (POSIX ERE syntax that both engines read
# the same way), case (sensitive | insensitive), word, globs (`*.ext` or `dir/`, passed to git grep as pathspecs).
#
# The first 20 back the eval questions, using the searches their references were checked with. The rest cover the
# public corpus: literal, regex, case-insensitive, whole-word, short patterns with no trigram, and multi-repo.

[[query]]
id = "q-find-01"
backs = "find-01"
repos = ["bubs-maps@a462d943bd05"]
pattern = "(struct|class|enum|actor) BubPlace"
regex = true
globs = ["*.swift"]

[[query]]
id = "q-find-02"
backs = "find-02"
repos = ["aether-engine@c9eeb4299473"]
pattern = "(struct|class|enum|actor|protocol|typealias) [A-Za-z_]*Engine([^A-Za-z_]|$)"
regex = true
globs = ["Sources/"]

[[query]]
id = "q-find-03"
backs = "find-03"
repos = ["aether-engine@c9eeb4299473", "bubs-mail@5f1fcb2f10aa", "bubs-maps@a462d943bd05", "bubstack@946d2f115b4a", "face-hugger@cac29bac7822", "idk-play@ea256e572f4f", "midi-me@31875748b728", "renaml@261313586bd2", "space-case@1eaedb9b0f04"]
pattern = "@main"
globs = ["*.swift"]

