# Hand-labelled answers over the public corpus: the committed example for `scripts/eval/run.py labels`. Private label
# files have the same format and live in the eval directory outside the repo (see docs/evaluation.md).
#
# Each label was made from the source with grep, before reading knowcode's answer. Fields: id, repo (or repos), argv,
# items (JSON path to the answer's rows), item (how a row reads: `{file}:{line}`), expected, match (exact | ci | file |
# file_line | line_within:N | suffix | regex), filter (optional regex an answer item must match to be scored),
# complete (false when expected is a known subset: precision is then not scored), notes.
root = "~/Library/Caches/dev.bubstack.knowcode/corpus/public"
match = "file_line"

[[label]]
id = "flask-find-class-Blueprint"
repo = "flask"
argv = ["find", "Blueprint", "-k", "class", "-n", "100"]
item = "{file}:{line}"
filter = "^src/"
expected = ["src/flask/blueprints.py:18", "src/flask/sansio/blueprints.py:34", "src/flask/sansio/blueprints.py:119"]
notes = "git grep -n '^class .*Blueprint' -- src: three classes whose names start with Blueprint."

[[label]]
id = "requests-refs-Session-request"
repo = "requests"
argv = ["refs", "Session.request", "-n", "1000"]
item = "{file}:{line}"
filter = "^src/"
expected = [
  "src/requests/sessions.py:671", "src/requests/sessions.py:682", "src/requests/sessions.py:693",
  "src/requests/sessions.py:712", "src/requests/sessions.py:726", "src/requests/sessions.py:740",
  "src/requests/sessions.py:750", "src/requests/api.py:71",
]
notes = "git grep -n '\\.request(' -- src/requests: calls on self or a Session; api.py:62 is a docstring example, not a call."
