# Replay scorers (scripts/eval/run.py replay). Each runs a knowcode command at a commit's parent and scores the file
# paths in its answer against the files the commit really changed. Format: see scripts/eval/replay.py. To try a
# planned feature, add a scorer here with its command and the JSON path to the files in its answer.

# Given one changed file, which other files does the change reach? Truth: the commit's other changed files.
[[scorer]]
name = "impact"
task = "per_file"
input = "source"
truth = "others"
argv = ["impact", "--file", "{file}", "-n", "1000"]
files = "items[].affected[].file"
k = [5, 10, 20]

# The same, counting `impact`'s `coupled` class (files history couples to the changed file that no reference
# reaches) after the affected symbols' files.
[[scorer]]
name = "impact-coupled"
task = "per_file"
input = "source"
truth = "others"
argv = ["impact", "--file", "{file}", "-n", "1000"]
files = ["items[].affected[].file", "items[].coupled[].file"]
k = [5, 10, 20]

# Given one changed file, which files usually change with it? `coupled`, ranked. (Until 738a6c7: hotspots' single
# top partner, `argv = ["hotspots", "{file}"]`, `files = "items[].co_change.file"`.)
[[scorer]]
name = "co-change"
task = "per_file"
input = "source"
truth = "others"
argv = ["coupled", "{file}", "-n", "10"]
files = "items[].partners[].file"
k = [1, 5, 10]

# Given the commit's non-test files, which tests should run? Truth: the test files the commit touched. `tests` over
# all the inputs at once, its selected list only. (Until 738a6c7: test files in the union of `impact --file` over
# the inputs, `argv = ["impact", "--file", "{file}", "-n", "1000"]`, `files = "items[].affected[].file"`.)
[[scorer]]
name = "test-selection"
task = "per_commit"
input = "source"
truth = "tests"
argv = ["tests", "{files}"]
files = "items[].tests[].file"
keep = "tests"
k = [5, 10, 20]

# Given the commit subject (ticket ids dropped), where is the code? Truth: every file the commit changed.
# `locate`: files ranked by BM25 over their entities' words; it drops filler words from the subject itself.
[[scorer]]
name = "concept-search"
task = "per_commit"
input = "none"
truth = "others"
argv = ["locate", "{subject}", "-n", "100"]
files = "items[].file"
k = [1, 5, 10, 20]

# The same question through content search for any keyword, one row per file, ranked definitions first (the
# concept-search scorer before `locate`).
[[scorer]]
name = "concept-grep"
task = "per_commit"
input = "none"
truth = "others"
argv = ["search", "{terms_regex}", "-e", "-i", "--files", "-n", "100"]
files = "items[].file"
k = [1, 5, 10, 20]

# The same question through `find` (definitions by name words).
[[scorer]]
name = "concept-find"
task = "per_commit"
input = "none"
truth = "others"
argv = ["find", "{terms}", "-n", "100"]
files = "items[].file"
k = [1, 5, 10, 20]
