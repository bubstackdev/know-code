# Release configuration. Regenerate .github/workflows/release.yml with dist 0.33.0.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# scripts/generate-release.py preserves an explicit CI-success gate on publishing.
# The upstream host condition otherwise accepts build jobs skipped by failed plan-jobs.
allow-dirty = ["ci"]
packages = ["knowcode"]
ci = "github"
hosting = ["github"]
installers = ["shell", "homebrew"]
tap = "bubstackdev/homebrew-tap"
publish-jobs = ["homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
unix-archive = ".tar.gz"
checksum = "sha256"
include = ["LICENSE-MIT", "LICENSE-APACHE"]
source-tarball = false
install-path = "~/.local/bin"
install-updater = false
install-success-msg = "Run knowcode setup claude (or codex/cursor), then ask about your repository. Indexing starts automatically."
pr-run-mode = "skip"
cache-builds = false
plan-jobs = ["./release-gate"]
# Runs the built Linux binaries on the oldest supported distributions; `host` waits for it, so nothing is published
# if they fail.
global-artifacts-jobs = ["./linux-compat"]
github-attestations = true

[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-14"

# Linux builds run in manylinux_2_28 (AlmaLinux 8, glibc 2.28), so the binaries need no glibc newer than 2.28 and
# run on RHEL 8-family, Debian 10, Ubuntu 20.04 and later. Built on the runner's own Ubuntu 24.04 they needed 2.39
# (Rust's std links pidfd_spawnp and pidfd_getpid when the build host's glibc has them). Images are pinned by digest;
# `host` names dist's own static build, which the container runs. ci.yml's linux-compat job reads these pins.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-24.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:e0adf18521ad35192df733a6c62d35df7801957d24e0470238aacecfab2188a3", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9", host = "aarch64-unknown-linux-musl" }

[dist.github-action-commits]
"actions/checkout" = "fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
"actions/upload-artifact" = "ea165f8d65b6e75b540449e92b4886f43607fa02"
"actions/download-artifact" = "d3f86a106a0bac45b974a628896c90dbdf5c8093"
"actions/attest-build-provenance" = "43d14bc2b83dec42d39ecae14e916627a18bb661"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
